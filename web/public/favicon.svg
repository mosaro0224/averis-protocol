<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="leftBlade" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" style="stop-color:#d0e4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6aaaf0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2060c8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rightBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0040c8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a60e8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Left blade: tall diagonal parallelogram (light-to-dark blue, top-right to bottom-left) -->
  <polygon points="22,92 40,8 58,8 38,92" fill="url(#leftBlade)" />
  <!-- Right blade: solid deep blue triangle, bottom-right -->
  <polygon points="50,58 78,92 64,92" fill="url(#rightBlade)" />
</svg>
